name: Validate ForgePilot
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skill metadata and references
        run: python scripts/validate_skill.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI
        run: |
          python scripts/forgepilot.py inspect .
          python scripts/forgepilot.py check . --include-hidden
